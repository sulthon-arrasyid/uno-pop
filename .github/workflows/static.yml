name: Deploy static content to Pages

on:
  # Berjalan otomatis setiap ada push ke branch main
  push:
    branches: ["main"]
  # Memungkinkan Anda menjalankan workflow secara manual dari tab Actions
  workflow_dispatch:

# Mengatur izin token GITHUB untuk deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Memastikan hanya satu deploy yang berjalan pada satu waktu
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Mengunggah seluruh isi repositori
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
