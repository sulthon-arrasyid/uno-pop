<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="UNO Pop">
    
    <title>UNO Pop Deck</title>
    
    <!-- Link ke file CSS -->
    <link rel="manifest" href="manifest.json">
    <link rel="preload" href="assets/fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <link rel="apple-touch-icon" href="assets/icon.svg">
    
    <!-- Script di-load dengan 'defer' agar DOM selesai dirender lebih dulu -->
    <script src="js/app.js" defer></script>
</head>
<body>

<div class="app-container">
    <header>
        <h1><span class="title-mark">UNO Pop Deck</span></h1>
    </header>

    <!-- Tombol untuk membuka pengaturan -->
    <button id="btn-toggle-settings" class="btn-secondary">⚙️ Atur Deck Custom</button>

    <!-- Panel Pengaturan Deck -->
    <section class="deck-builder" id="deck-builder-panel" style="display: none;">
        <h3>Pengaturan Jumlah Kartu</h3>
        <div class="input-group">
            <label>Kartu +1: <input type="number" id="input-plus1" value="5" min="0"></label>
            <label>Kartu +2: <input type="number" id="input-plus2" value="2" min="0"></label>
            <label>Kartu +3: <input type="number" id="input-plus3" value="1" min="0"></label>
            <label>Kartu POP! +1: <input type="number" id="input-pop1" value="1" min="0"></label>
            <label>Kartu POP! +2: <input type="number" id="input-pop2" value="1" min="0"></label>
            <label>Kartu UNO!: <input type="number" id="input-uno" value="1" min="0"></label>
        </div>
        <button id="btn-save-deck" class="btn-primary">Simpan & Reset</button>
    </section>

    <!-- Status Permainan -->
    <section class="status-panel">
        <div class="status-row">
            <span>Sisa Kartu di Deck:</span>
            <span id="deck-count">—</span>
        </div>
        <div class="status-row">
            <span>Total Akumulasi:</span>
            <span id="accum-count">0</span>
        </div>
        <div id="game-status" class="status-message ready">Siap bermain</div>
    </section>

    <!-- Display Kartu -->
    <section class="card-display">
        <div id="active-card" class="card empty">
            <span id="active-card-value">?</span>
        </div>
    </section>

    <!-- Tombol Aksi -->
    <section class="actions">
        <button id="btn-draw" class="btn-primary">Ambil Kartu</button>
        <button id="btn-reset" class="btn-secondary">Reset Tumpukan</button>
    </section>

    <!-- Riwayat Penarikan -->
    <section class="history-panel">
        <h3>Riwayat (<span id="history-count">0</span> Ditarik)</h3>
        <div id="history-list" class="history-list"></div>
    </section>
</div>

</body>
</html>
